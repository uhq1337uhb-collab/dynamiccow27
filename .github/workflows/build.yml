name: Build IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          xcodebuild -project DynamicCow.xcodeproj \
            -target DynamicCow \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Release-iphoneos/DynamicCow.app" Payload/
          zip -qry DynamicCow-27.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicCow-27-ipa
          path: DynamicCow-27.ipa
